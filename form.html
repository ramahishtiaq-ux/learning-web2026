<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .container-fluid{
            background: linear-gradient(45deg, rgb(19, 152, 197) 0%, rgb(217, 20, 194) 47%);
            padding:30px;
            min-height:100vh;
        }

        h1{
            text-align:center;
            color:white;
        }

        .submit{
            padding:10px 30px;
            border:none;
            background:#43afe9;
            color:#fff;
            border-radius:5px;
        }

        .a{
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <h1>Registration Form Employees</h1>
    <hr>

    <form id="forms">

        <div class="row">

            <!-- Name -->
            <div class="col-md-6 col-12 mb-4">
                <input type="text" class="form-control" id="efname" placeholder="Enter Your Name">
                <div class="error text-danger"></div>
            </div>

            <!-- Father Name -->
            <div class="col-md-6 col-12 mb-4">
                <input type="text" class="form-control" id="fathername" placeholder="Enter Your Father Name">
                <div class="error7 text-danger"></div>
            </div>

            <!-- Designation -->
            <div class="col-md-6 col-12 mb-4">
                <input type="text" class="form-control" id="edname" placeholder="Enter Your Designation">
                <div class="error1 text-danger"></div>
            </div>

            <!-- Email -->
            <div class="col-md-6 col-12 mb-4">
                <input type="email" class="form-control" id="emname" placeholder="Enter Your Email">
                <div class="error2 text-danger"></div>
            </div>

            <!-- CNIC -->
            <div class="col-md-6 col-12 mb-4">
                <input type="number" class="form-control" id="ecname" placeholder="CNIC">
                <div class="error3 text-danger"></div>
            </div>

            <!-- Phone -->
            <div class="col-md-6 col-12 mb-4">
                <input type="number" class="form-control" id="ephname" placeholder="Phone Number">
                <div class="error4 text-danger"></div>
            </div>

            <!-- Country -->
            <div class="col-md-6 col-12 mb-4">
                <label>Country:</label>
                <select id="econame" class="form-select">
                    <option value="">Select Country</option>
                    <option>Pakistan</option>
                    <option>India</option>
                </select>

                <div class="error5 text-danger"></div>
            </div>

            <!-- Province -->
            <div class="col-md-6 col-12 mb-4">
                <input type="text" class="form-control" id="epname" placeholder="Enter Province">
                <div class="error6 text-danger"></div>
            </div>

            <div class="a">
                <input class="submit" type="submit" value="Submit">
            </div>

        </div>

    </form>

</div>

<script>

const myForm = document.querySelector('#forms');

const nameInput = document.querySelector('#efname');
const fatherInput = document.querySelector('#fathername');
const desInput = document.querySelector('#edname');
const emailInput = document.querySelector('#emname');
const cnicInput = document.querySelector('#ecname');
const phoneInput = document.querySelector('#ephname');
const counInput = document.querySelector('#econame');
const provInput = document.querySelector('#epname');

const mError = document.querySelector('.error');
const fatherError = document.querySelector('.error7');
const desError = document.querySelector('.error1');
const emailError = document.querySelector('.error2');
const cnicError = document.querySelector('.error3');
const phoneError = document.querySelector('.error4');
const counError = document.querySelector('.error5');
const proError = document.querySelector('.error6');

myForm.addEventListener('submit', onSubmit);

function onSubmit(e){

    e.preventDefault();

    // Name
    if(nameInput.value==""){
        mError.style.display="block";
        mError.innerHTML="<p>Please Enter Your Name.</p>";
    }
    else{
        mError.style.display="none";
    }

    // Father Name
    if(fatherInput.value==""){
        fatherError.style.display="block";
        fatherError.innerHTML="<p>Please Enter Your Father Name.</p>";
    }
    else{
        fatherError.style.display="none";
    }

    // Designation
    if(desInput.value==""){
        desError.style.display="block";
        desError.innerHTML="<p>Please Enter Designation.</p>";
    }
    else{
        desError.style.display="none";
    }

    // Email
    if(emailInput.value==""){
        emailError.style.display="block";
        emailError.innerHTML="<p>Please Enter Email.</p>";
    }
    else{
        emailError.style.display="none";
    }

    // CNIC
    if(cnicInput.value==""){
        cnicError.style.display="block";
        cnicError.innerHTML="<p>Please Enter CNIC.</p>";
    }
    else{
        cnicError.style.display="none";
    }

    // Phone
    if(phoneInput.value==""){
        phoneError.style.display="block";
        phoneError.innerHTML="<p>Please Enter Phone Number.</p>";
    }
    else{
        phoneError.style.display="none";
    }

    // Country
    if(counInput.value==""){
        counError.style.display="block";
        counError.innerHTML="<p>Please Select Your Country.</p>";
    }
    else{
        counError.style.display="none";
    }

    // Province
    if(provInput.value==""){
        proError.style.display="block";
        proError.innerHTML="<p>Please Enter Province.</p>";
    }
    else{
        proError.style.display="none";
    }

}

</script>

</body>
</html>
