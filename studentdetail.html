<!DOCTYPE html>
<html>
<head>
    <title>Array Object Literal</title>
</head>
<body>

<h1>Array Object Literal</h1>

<script>
    const Students = [
        {
            Studentid: 1,
            Studentname: "Hina",
            Course: "BS SE",
            ObtainedMarks: 90
        },
        {
            Studentid: 2,
            Studentname: "Ramsha",
            Course: "BS IT",
            ObtainedMarks: 80
        },
        {
            Studentid: 3,
            Studentname: "Eysha",
            Course: "BS CS",
            ObtainedMarks: 70
        },
    ]

    console.log(Students[1].Course);
    console.log(Students[1].ObtainedMarks);
</script>

</body>
</html>
